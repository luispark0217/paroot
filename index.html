<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECF0E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A16" media="(prefers-color-scheme: dark)">
<meta name="description" content="공부하다 잠깐, 식물 퀴즈 한 문제 풀고 식물을 키우는 앱, 파릇">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="파릇">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>파릇</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: a single quiet room — arched window with live game-time sky, plant on the sill, care timeline under it. */
:root{
  --bg:#ECF0E8; --wall:#F3F5EF; --paper:#FAFBF7; --ink:#1C2A21; --muted:#68796D; --line:#D5DED1; --frame:#C9D3C4;
  --leaf:#3D7653; --leaf-2:#6C9F78; --leaf-deep:#2B5A3F; --leaf-var:#CBD98E; --stem:#4C7C58; --wood:#8A6A4E;
  --succ:#86AFA5; --succ-tip:#C98A8A; --bloom:#8C7BB8; --flower:#E39AA8; --fruit:#C9503F; --sun:#E7B541; --soil:#6E5240;
  --water:#4C86A3; --feed:#A9853A; --grow:#3D7653; --accent:#2E6845; --on-accent:#F3F7F1; --warn:#B2643C;
  --pot-1:#B7C8B1; --pot-2:#D8D2C6; --pot-3:#58796A; --pot-4:#C79A80; --pot-5:#EEF0EA; --shade:rgba(30,45,35,.09);
  --dawn-a:#F3D9C9; --dawn-b:#F7EBD6; --day-a:#BFDCE8; --day-b:#EAF4EC; --dusk-a:#E9B99A; --dusk-b:#C9A7B8; --night-a:#1E2A40; --night-b:#34405A;
  --dim:#0F1A14;
  --f-display:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121A16; --wall:#18221C; --paper:#1D2822; --ink:#E0E9DE; --muted:#97AA9C; --line:#2A3830; --frame:#33443A;
  --leaf:#6DAB7F; --leaf-2:#4F8A62; --leaf-deep:#3E7454; --leaf-var:#A8BB6B; --stem:#5E9470; --wood:#A08064;
  --succ:#7FA9A0; --succ-tip:#C98A8A; --bloom:#A595D1; --flower:#E7A3B1; --fruit:#D96553; --sun:#E9C05A; --soil:#4A382C;
  --water:#7DB3CE; --feed:#D2AE62; --grow:#7DBE93; --accent:#7DBE93; --on-accent:#0F1A13; --warn:#E39C74;
  --pot-1:#56695C; --pot-2:#6B665D; --pot-3:#2F4B3C; --pot-4:#8A6656; --pot-5:#A8ADA4; --shade:rgba(0,0,0,.3);
  --dawn-a:#5A4A4A; --dawn-b:#3E3C3A; --day-a:#3C5866; --day-b:#2A3B35; --dusk-a:#5E4436; --dusk-b:#3F3546; --night-a:#0C1220; --night-b:#18213A;
  --dim:#000; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A16; --wall:#18221C; --paper:#1D2822; --ink:#E0E9DE; --muted:#97AA9C; --line:#2A3830; --frame:#33443A;
  --leaf:#6DAB7F; --leaf-2:#4F8A62; --leaf-deep:#3E7454; --leaf-var:#A8BB6B; --stem:#5E9470; --wood:#A08064;
  --succ:#7FA9A0; --succ-tip:#C98A8A; --bloom:#A595D1; --flower:#E7A3B1; --fruit:#D96553; --sun:#E9C05A; --soil:#4A382C;
  --water:#7DB3CE; --feed:#D2AE62; --grow:#7DBE93; --accent:#7DBE93; --on-accent:#0F1A13; --warn:#E39C74;
  --pot-1:#56695C; --pot-2:#6B665D; --pot-3:#2F4B3C; --pot-4:#8A6656; --pot-5:#A8ADA4; --shade:rgba(0,0,0,.3);
  --dawn-a:#5A4A4A; --dawn-b:#3E3C3A; --day-a:#3C5866; --day-b:#2A3B35; --dusk-a:#5E4436; --dusk-b:#3F3546; --night-a:#0C1220; --night-b:#18213A;
  --dim:#000; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 104px}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font-size:1.5rem;letter-spacing:-.02em;line-height:1.1}
.time-pill{position:absolute;left:16px;top:14px;z-index:3;display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--ink);background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:blur(6px);border-radius:99px;padding:5px 11px 5px 9px}
.time-pill i{width:8px;height:8px;border-radius:50%;background:var(--sun);display:inline-block}
.time-pill.night i{background:#EDEAD8;box-shadow:inset -2px -1px 0 rgba(0,0,0,.25)}
.time-pill small{color:var(--muted);font-size:.72rem}
.dew{display:flex;align-items:center;gap:6px;font-size:.9rem;font-weight:600}
.dew svg{width:15px;height:15px}
.dew small{font-weight:400;color:var(--muted);font-size:.74rem}

/* scene */
.scene{position:relative;height:300px;border-radius:28px;overflow:hidden;background:var(--wall)}
.window{position:absolute;left:50%;top:22px;width:196px;height:206px;transform:translateX(-50%);border-radius:98px 98px 6px 6px;
  border:7px solid var(--frame);overflow:hidden;background:linear-gradient(180deg,var(--sky-a,var(--day-a)),var(--sky-b,var(--day-b)));transition:background 2s}
.window .bar-v{position:absolute;left:50%;top:0;bottom:0;width:5px;margin-left:-2.5px;background:var(--frame)}
.window .bar-h{position:absolute;top:56%;left:0;right:0;height:5px;background:var(--frame)}
.orb{position:absolute;width:22px;height:22px;border-radius:50%;margin:-11px 0 0 -11px;transition:left 3s linear,top 3s linear}
.orb.sun{background:var(--sun);box-shadow:0 0 22px var(--sun)}
.orb.moon{background:#EDEAD8;box-shadow:inset -6px -2px 0 rgba(0,0,0,.18)}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.8}
.sill{position:absolute;left:0;right:0;bottom:0;height:46px;background:var(--paper);border-top:1px solid var(--line)}
.dimmer{position:absolute;inset:0;background:var(--dim);pointer-events:none;transition:opacity 2s;opacity:0}
.plant{position:absolute;left:50%;bottom:22px;width:220px;height:253px;transform:translateX(-50%);--hole:var(--sky-b,var(--day-b))}
.plant svg{width:100%;height:100%;display:block}
.sway{transform-origin:100px 160px;animation:sway 8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
.drop{position:absolute;width:6px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--water);top:30px;animation:fall .9s ease-in forwards}
@keyframes fall{to{transform:translateY(150px);opacity:0}}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--feed);bottom:70px;animation:rise 1.3s ease-out forwards}
@keyframes rise{to{transform:translateY(-120px) scale(.3);opacity:0}}

/* plant identity */
.ident{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:-6px}
.ident h2{font-size:1.5rem;line-height:1.2}
.ident .latin{font-style:italic;color:var(--muted);font-size:.8rem}
.ident input{font-family:var(--f-display);font-size:1.3rem;font-weight:700;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:2px 8px}
.mini-btns{display:flex;gap:4px;flex:none}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:16px;height:16px}
.stage-line{display:flex;gap:4px;margin-top:10px}
.stage-line span{flex:1;height:4px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.stage-line span i{position:absolute;inset:0;width:0;background:var(--grow);border-radius:4px;transition:width .6s}
.stage-names{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);margin-top:4px}
.stage-names b{color:var(--ink);font-weight:600}

/* vitals */
.vitals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vital{padding:12px 12px 11px;border-radius:16px;background:var(--paper);display:flex;flex-direction:column;gap:2px;min-width:0}
.vital .k{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:5px}
.vital .k i{width:6px;height:6px;border-radius:50%}
.vital .v{font-family:var(--f-display);font-size:1.3rem;font-weight:700;line-height:1.25}
.vital .s{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vital .s.warn{color:var(--warn);font-weight:600}
.vital .bar{position:relative;height:4px;border-radius:4px;background:var(--line);margin-top:6px}
.vital .bar span{position:absolute;top:0;bottom:0;border-radius:4px}
.vital .bar .band{background:color-mix(in srgb,var(--ink) 14%,transparent)}
.note{font-size:.86rem;color:var(--muted);min-height:1.4em;padding:0 2px}
.note b{color:var(--ink);font-weight:600}

/* dock */
.dock{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 6px 10px;text-align:center;white-space:nowrap;border-radius:16px;border:1px solid var(--line);background:var(--paper);font-size:.88rem;font-weight:500;transition:transform .12s}
.act:active{transform:scale(.97)}
.act svg{width:20px;height:20px;flex:none}
.act small{display:block;font-size:.68rem;color:var(--muted);font-weight:400;line-height:1.1}
.act[disabled]{opacity:.45;cursor:default}
.act.main{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.act.main small{color:var(--on-accent);opacity:.75}

/* shelf */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-h h3{font-size:1.08rem}
.sec-h small{color:var(--muted);font-size:.76rem}
.shelf{display:flex;gap:4px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity;border-bottom:6px solid var(--paper);box-shadow:0 1px 0 var(--line)}
.slot{flex:none;width:76px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;padding:4px 0 2px;border:0;background:none;border-radius:12px;font-size:.72rem;--hole:var(--bg)}
.slot svg{width:66px;height:76px}
.slot .tag{font-size:.64rem;color:var(--muted)}
.slot .tag.need{color:var(--warn);font-weight:600}
.slot.on{background:var(--paper)}
.slot.add{justify-content:center;color:var(--muted);gap:4px}
.slot.add span:first-child{width:44px;height:44px;border-radius:50%;border:1px dashed var(--muted);display:grid;place-items:center;font-size:1.2rem}

.ghost{background:none;border:0;color:var(--accent);font-weight:600;font-size:.88rem;padding:6px 0;text-align:left}

/* shop */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button{flex:none;border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-size:.8rem;color:var(--muted)}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);--hole:var(--bg)}
.item svg{width:70px;height:80px}
.item h4{font-size:1rem}
.item .meta{font-size:.76rem;color:var(--muted);line-height:1.45}
.lv{display:inline-block;font-size:.66rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;color:var(--muted)}
.price{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:99px;padding:7px 12px;font-size:.8rem;font-weight:600;white-space:nowrap}
.price[disabled]{border-color:var(--line);color:var(--muted);cursor:default}

/* book */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:12px 4px;text-align:center}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font-family:var(--f-display);font-size:1.25rem}
.stat small{color:var(--muted);font-size:.68rem}
.tabs2{display:flex;gap:18px;border-bottom:1px solid var(--line)}
.tabs2 button{background:none;border:0;padding:8px 0;font-size:.9rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs2 button.on{color:var(--ink);border-color:var(--ink);font-weight:600}
details.entry{border-bottom:1px solid var(--line);--hole:var(--bg)}
details.entry summary{list-style:none;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;cursor:pointer}
details.entry summary::-webkit-details-marker{display:none}
details.entry summary svg.p{width:52px;height:60px}
details.entry summary .chev{width:16px;height:16px;color:var(--muted);transition:transform .2s}
details.entry[open] summary .chev{transform:rotate(180deg)}
details.entry .body{padding:0 0 14px 64px;font-size:.86rem;display:flex;flex-direction:column;gap:8px}
details.entry .body ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.cares{display:flex;flex-wrap:wrap;gap:4px}
.cares span{font-size:.7rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--muted)}
.locked{opacity:.55}
.wrongq{padding:14px 0;border-bottom:1px solid var(--line);font-size:.86rem;display:flex;flex-direction:column;gap:6px}
.wrongq b{font-weight:600}
.wrongq .ans{color:var(--accent);font-weight:600}
.wrongq p{margin:0;color:var(--muted)}
.log{display:flex;flex-direction:column}
.log div{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.84rem}
.log time{color:var(--muted);font-size:.74rem}
.save-box{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;background:var(--paper);font-size:.84rem}
.save-box p{margin:0;color:var(--muted)}
.save-box textarea{width:100%;min-height:76px;font:inherit;font-size:.74rem;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink);resize:vertical;word-break:break-all}
.save-box .btns{display:flex;gap:6px;flex-wrap:wrap}
.chip-btn{border:1px solid var(--line);background:var(--wall);border-radius:99px;padding:7px 12px;font-size:.8rem}
.chip-btn.solid{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.welcome{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--paper)}
.welcome svg{width:28px;height:28px;flex:none}
.welcome b{display:block;font-size:.95rem}
.welcome span{font-size:.82rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.86rem;padding:18px 0}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav button{background:none;border:0;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--muted)}
nav button svg{width:21px;height:21px}
nav button.on{color:var(--ink);font-weight:600}

/* quiz sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.q-head{display:flex;align-items:center;gap:14px;--hole:var(--bg)}
.q-head svg{width:56px;height:64px;flex:none}
.q-head p{margin:0;font-size:.82rem;color:var(--muted)}
.q-head h2{font-size:1.12rem}
.q-label{font-size:.72rem;letter-spacing:.12em;color:var(--muted)}
.q-text{font-family:var(--f-display);font-size:1.32rem;line-height:1.5;font-weight:700;margin:6px 0 0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:.93rem;display:flex;gap:12px;align-items:center}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.72rem;color:var(--muted)}
.opt.right{border-color:var(--grow);box-shadow:inset 0 0 0 1px var(--grow)}
.opt.right .k{background:var(--grow);border-color:var(--grow);color:var(--on-accent)}
.opt.wrong{border-color:var(--warn)}
.opt.wrong .k{background:var(--warn);border-color:var(--warn);color:var(--on-accent)}
.opt.dim{opacity:.5}
.opt[disabled]{cursor:default}
.explain{font-size:.9rem;line-height:1.65;padding:14px 16px;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
.explain b{display:block;margin-bottom:4px}
.explain .gain{color:var(--water);font-weight:600}
.q-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.link{background:none;border:0;color:var(--muted);font-size:.84rem;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.cta{background:var(--accent);color:var(--on-accent);border:0;border-radius:14px;padding:13px 20px;font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.85rem;opacity:0;transition:all .3s;z-index:30;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){.sway{animation:none}.drop,.spark{display:none}.orb,.window,.dimmer{transition:none}}
</style>

<div class="wrap">
  <header class="top">
    <h1>파릇</h1>
    <div class="dew num" title="이슬은 퀴즈와 공부 타이머로 모아요"><svg viewBox="0 0 16 16"><path d="M8 1.5C8 1.5 3 7 3 10a5 5 0 0 0 10 0c0-3-5-8.5-5-8.5z" fill="var(--water)"/></svg><span id="dew">0</span><small>이슬</small></div>
  </header>

  <!-- 정원 -->
  <section id="v-garden" class="wrap">
    <div class="scene" id="scene">
      <div class="window" id="win"><span class="bar-v"></span><span class="bar-h"></span></div>
      <div class="sill"></div>
      <div class="plant" id="plant"></div>
      <div class="dimmer" id="dimmer"></div>
      <div class="time-pill num" id="clock"><i></i><span></span></div>
    </div>

    <div>
      <div class="ident">
        <div style="min-width:0;flex:1" id="name-box"><h2 id="p-name">몬스테라</h2><div class="latin" id="p-latin"></div></div>
        <div class="mini-btns">
          <button class="icon-btn" id="b-rename" aria-label="이름 바꾸기" title="이름 바꾸기"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M10.5 2.5l3 3L6 13H3v-3z"/></svg></button>

/* =============== state =============== */
const LS='small-greenhouse-v1';
let pendingAway=null;
const dayKey=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
function fresh(){const now=Date.now();return{v:2,savedAt:now,start:now,dew:10,streak:0,lastQuizDay:null,answered:0,correct:0,seen:[],wrong:[],log:[],lastSeen:now,active:'p1',
  plants:[{id:'p1',sp:'monstera',xp:24,water:55,feed:45,lastTick:now,lastWater:now,lastWipe:0,born:now,nick:'',pot:0}]}}
function migrate(s){
  if(!s||!s.plants||!s.plants.length)return fresh();
  s.v=2; s.start=s.start||Math.min(...s.plants.map(p=>p.born||Date.now()));
  s.answered=s.answered??((s.quizzes||0)*3); s.correct=s.correct||0; s.seen=s.seen||[]; s.wrong=s.wrong||[]; s.log=s.log||[]; delete s.timer;
  s.plants.forEach(p=>{if(p.nick==null)p.nick='';if(p.pot==null)p.pot=SPECIES[p.sp]?SPECIES[p.sp].pot:0;});
  s.plants=s.plants.filter(p=>SPECIES[p.sp]); if(!s.plants.length)return fresh();
  return s;
}
let S=null;try{S=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
S=migrate(S);

let dbDoc=null,saveT=null;
function save(now){S.savedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  clearTimeout(saveT);const push=()=>{if(dbDoc)dbDoc.set(JSON.parse(JSON.stringify(S))).catch(()=>{})};if(now)push();else saveT=setTimeout(push,900)}
function exportCode(){try{return 'GH2.'+btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){return''}}
function importCode(code){try{code=(code||'').trim().replace(/\s+/g,'');if(!code.startsWith('GH2.'))return null;const o=JSON.parse(decodeURIComponent(escape(atob(code.slice(4)))));return o&&o.plants&&o.plants.length?migrate(o):null}catch(e){return null}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
(async()=>{try{
  if(!window.claude||!window.claude.use)return;
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(!db||!user)return; const id=await user.id(); if(!id)return;
  dbDoc=db.collection('data/users/'+id).doc('garden');

  if(snap.exists){const r=snap.data();if(r&&r.plants&&r.savedAt>(S.savedAt||0)){S=migrate(JSON.parse(JSON.stringify(r)));tick();renderAll();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}return}}
  save();
}catch(e){}})();

/* =============== game time =============== */
const gameHours=t=>(t-S.start)/GH+6;                // 1일째 오전 6시에 시작
const hourOfDay=gh=>((gh%24)+24)%24;
const isDay=gh=>{const h=hourOfDay(gh);return h>=DAY[0]&&h<DAY[1]};
function clockText(t){const gh=gameHours(t),d=Math.floor(gh/24)+1,h=hourOfDay(gh),hh=Math.floor(h),mm=Math.floor((h-hh)*6)*10;
  const ap=hh<12?'오전':'오후',h12=hh%12===0?12:hh%12;return `${d}일째 · ${ap} ${h12}:${String(mm).padStart(2,'0')}`}
function shortStamp(t){const gh=gameHours(t),d=Math.floor(gh/24)+1,hh=Math.floor(hourOfDay(gh));return `${d}일째 ${hh<12?'오전':'오후'} ${hh%12===0?12:hh%12}시`}
function fmtGame(gh){if(gh<1)return'1시간 안';if(gh<24)return Math.round(gh)+'시간';const d=gh/24;return(d<10?d.toFixed(1).replace(/\.0$/,''):Math.round(d))+'일'}
function fmtReal(gh){const m=gh*60/SPEED;if(m<1)return'1분 안';if(m<60)return Math.round(m)+'분';const h=Math.floor(m/60),r=Math.round(m%60);return r?`${h}시간 ${r}분`:`${h}시간`}
function phase(gh){const h=hourOfDay(gh);if(h>=5&&h<7)return'dawn';if(h>=7&&h<17.5)return'day';if(h>=17.5&&h<20)return'dusk';return'night'}

/* =============== simulation =============== */
const stageOf=xp=>{let s=0;for(let i=0;i<XP.length;i++)if(xp>=XP[i])s=i;return{s,p:s>=4?1:(xp-XP[s])/(XP[s+1]-XP[s])}};
const inBand=(sp,w)=>w>=sp.band[0]&&w<=sp.band[1];
function stepPlant(p,sp,h,gh){
  const day=isDay(gh);
  p.water=Math.max(0,p.water-sp.dry*h*(day?1:.5));   // 밤엔 기공이 닫혀 증산이 줄어요
  p.feed=Math.max(0,p.feed-.4*h);
  if(day&&inBand(sp,p.water)&&p.feed>15)p.xp+=h*sp.gr*(p.feed>=50?1.5:1);
}
function tick(){
  const now=Date.now();
  S.plants.forEach(p=>{
    const sp=SPECIES[p.sp],before=stageOf(p.xp).s;
    let t=Math.max(p.lastTick,now-30*24*GH);
    while(t<now){const dt=Math.min(.5*GH,now-t);stepPlant(p,sp,dt/GH,gameHours(t));t+=dt}
    p.lastTick=now;
    const after=stageOf(p.xp).s; if(after>before)stageUp(p,after,true);
  });
}
function forecast(p){
  const sp=SPECIES[p.sp],st=stageOf(p.xp),now=Date.now();
  let gh=gameHours(now),w=p.water,f=p.feed,xp=p.xp,h=0;
  const res={water:null,feed50:null,feed15:null,stage:null};
  const target=st.s<4?XP[st.s+1]:null;
  if(w<sp.band[0])res.water=0;
  if(f<50)res.feed50=0; if(f<=15)res.feed15=0;
  while(h<24*40&&(res.water===null||res.feed15===null||(target&&res.stage===null))){
    const day=isDay(gh+h);
    w=Math.max(0,w-sp.dry*.25*(day?1:.5)); f=Math.max(0,f-.4*.25);
    if(res.water===null&&w<sp.band[0])res.water=h;
    if(res.feed50===null&&f<50)res.feed50=h;
    if(res.feed15===null&&f<=15)res.feed15=h;
    // 성장 예측: 물은 알맞게 유지한다고 가정, 영양은 그대로 둘 때(15 이하로 떨어지면 최소 유지)
    if(target&&res.stage===null){if(day)xp+=.25*sp.gr*(f>=50?1.5:1);if(xp>=target)res.stage=h}
    h+=.25;
  }
  return res;
}

/* =============== drawing =============== */
function rng(seed){let a=0;for(const c of String(seed))a=(a*31+c.charCodeAt(0))>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const f1=n=>(+n).toFixed(1);
const leafD=(L,W)=>`M0 0 C${f1(W*.6)} ${f1(-L*.25)} ${f1(W*.55)} ${f1(-L*.8)} 0 ${f1(-L)} C${f1(-W*.55)} ${f1(-L*.8)} ${f1(-W*.6)} ${f1(-L*.25)} 0 0Z`;
const heartD=(L,W)=>`M0 0 C${f1(W*.95)} ${f1(-L*.05)} ${f1(W*.8)} ${f1(-L*.9)} 0 ${f1(-L)} C${f1(-W*.8)} ${f1(-L*.9)} ${f1(-W*.95)} ${f1(-L*.05)} 0 0Z`;
function leaf(x,y,a,L,W,fill,shape,rib,extra){return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(a)})"><path d="${(shape||leafD)(L,W)}" fill="${fill}"${extra||''}/>${rib===false?'':`<path d="M0 -1.5 L0 ${f1(-L*.85)}" stroke="var(--stem)" stroke-width=".9" opacity=".5" fill="none"/>`}</g>`}
function stem(x0,y0,x1,y1,bend,w,col){return `<path d="M${f1(x0)} ${f1(y0)} Q${f1((x0+x1)/2+bend)} ${f1((y0+y1)/2)} ${f1(x1)} ${f1(y1)}" stroke="${col||'var(--stem)'}" stroke-width="${w||2.4}" fill="none" stroke-linecap="round"/>`}
const lerp=(a,b,t)=>a+(b-a)*t;
function flower5(x,y,r,col,center){let o=`<g transform="translate(${f1(x)} ${f1(y)})">`;for(let k=0;k<5;k++)o+=`<ellipse rx="${f1(r*.45)}" ry="${f1(r)}" cy="${f1(-r*.7)}" fill="${col}" transform="rotate(${k*72})"/>`;return o+`<circle r="${f1(r*.4)}" fill="${center||'var(--sun)'}"/></g>`}

function drawPlant(k,s,p,seed,night){
  const R=rng(seed+k),bx=100,by=160,t=(s+p)/4,g=.35+.65*t;let o='';
  if(s===0){const h=6+10*p;o+=stem(bx,by,bx,by-h,1.5,2);o+=leaf(bx,by-h,-55,7+4*p,6+3*p,'var(--leaf-2)',leafD,false)+leaf(bx,by-h,55,7+4*p,6+3*p,'var(--leaf-2)',leafD,false);return o}
  switch(k){
  case'monstera':{const n=[0,2,3,5,6][s]+(p>.6&&s<4?1:0);

/* =============== render =============== */
const $=id=>document.getElementById(id);
let note='',bookTab='dex',shopFilter='all';
const active=()=>S.plants.find(p=>p.id===S.active)||S.plants[0];
const pname=p=>p.nick||SPECIES[p.sp].name;
const stageName=(sp,s)=>s===4?sp.final:STAGES[s];
function need(p){const sp=SPECIES[p.sp];if(p.water<sp.band[0])return'물';if(p.water>sp.band[1]+8)return'과습';if(p.feed<=15)return'영양';return''}

function renderScene(){
  const now=Date.now(),gh=gameHours(now),ph=phase(gh),h=hourOfDay(gh),win=$('win');
  const sky={dawn:['--dawn-a','--dawn-b'],day:['--day-a','--day-b'],dusk:['--dusk-a','--dusk-b'],night:['--night-a','--night-b']}[ph];
  $('scene').style.setProperty('--sky-a',`var(${sky[0]})`);$('scene').style.setProperty('--sky-b',`var(${sky[1]})`);
  $('dimmer').style.opacity=ph==='night'?.28:ph==='dusk'?.08:0;
  let orb=win.querySelector('.orb');if(!orb){orb=document.createElement('span');win.appendChild(orb)}
  const day=h>=5.5&&h<19.5,frac=day?(h-5.5)/14:((h-19.5+24)%24)/10.5;
  orb.className='orb '+(day?'sun':'moon');orb.style.left=(12+76*frac)+'%';orb.style.top=(78-62*Math.sin(Math.PI*frac))+'%';
  win.querySelectorAll('.star').forEach(e=>e.remove());
  if(ph==='night')[[20,18],[34,32],[62,14],[78,30],[48,22],[28,48],[70,44]].forEach(([x,y])=>{const s=document.createElement('span');s.className='star';s.style.left=x+'%';s.style.top=y+'%';win.appendChild(s)});
  const c=$('clock');c.className='time-pill num'+(isDay(gh)?'':' night');c.querySelector('span').innerHTML=clockText(now)+(isDay(gh)?'':' <small>· 쉬는 중</small>');
}
function etaHTML(gh,warnTxt,okPrefix){
  if(gh===0)return `<div class="eta warn"><b>${warnTxt}</b><small>지금</small></div>`;
  if(gh===null)return `<div class="eta"><b>여유 있음</b><small>40일 이상</small></div>`;
  return `<div class="eta"><b>${okPrefix} ${fmtGame(gh)}</b><small>현실 ${fmtReal(gh)}</small></div>`;
}
function renderGarden(){
  renderScene();
  const p=active(),sp=SPECIES[p.sp],st=stageOf(p.xp),night=!isDay(gameHours(Date.now())),fc=forecast(p);
  if(!$('name-box').querySelector('input')){$('p-name').textContent=pname(p);$('p-latin').textContent=(p.nick?sp.name+' · ':'')+sp.latin}
  $('plant').innerHTML=potSVG(p.sp,st.s,st.p,p.id,p.pot,{sway:true,night});
  $('stage-line').innerHTML=[1,2,3,4].map(i=>`<span><i style="width:${st.s>=i?100:st.s===i-1?(st.p*100).toFixed(0):0}%"></i></span>`).join('');
  $('stage-names').innerHTML=STAGES.map((n,i)=>i===st.s?`<b>${stageName(sp,i)}</b>`:`<span>${stageName(sp,i)}</span>`).join('');
  const tip=gh=>`현실 ${fmtReal(gh)}`;
  const vital=(id,dot,label,val,sub,warn,bar,title)=>{$(id).innerHTML=`<span class="k"><i style="background:${dot}"></i>${label}</span><span class="v num">${val}</span><span class="s${warn?' warn':''}">${sub}</span><span class="bar">${bar}</span>`;$(id).title=title||''};
  // 물
  let ws,ww=false,wt='';
  if(p.water>sp.band[1]){ws=`${fmtGame((p.water-sp.band[1])/sp.dry)} 쉬기`;ww=true}
  else if(fc.water===0){ws='지금 물 주기';ww=true}
  else if(fc.water===null)ws='여유 있음';
  else{ws=`${fmtGame(fc.water)} 뒤`;wt=tip(fc.water)}
  vital('v-water','var(--water)','물',Math.round(p.water)+'%',ws,ww,`<span class="band" style="left:${sp.band[0]}%;width:${sp.band[1]-sp.band[0]}%"></span><span style="left:0;width:${p.water}%;background:var(--water)"></span>`,`알맞은 수분 ${sp.band[0]}~${sp.band[1]}%${wt?' · '+wt:''}`);
  // 영양
  let ns,nw=false,nt='';
  if(p.feed<=15){ns='영양제 필요';nw=true}
  else{const h=p.feed>=50?fc.feed50:fc.feed15;ns=`${fmtGame(h)} 버팀`;nt=tip(h)}
  vital('v-feed','var(--feed)','영양',Math.round(p.feed)+'%',ns,nw,`<span style="left:0;width:${p.feed}%;background:var(--feed)"></span>`,`50% 이상이면 1.5배로 자라요${nt?' · '+nt:''}`);
  // 성장
  if(st.s>=4)vital('v-grow','var(--grow)','성장','완료',sp.final,false,`<span style="left:0;width:100%;background:var(--grow)"></span>`);
  else{const blocked=!inBand(sp,p.water)?'물이 맞아야 자라요':p.feed<=15?'영양이 필요해요':'';
    vital('v-grow','var(--grow)','→ '+stageName(sp,st.s+1),Math.floor(st.p*100)+'%',blocked||`${fmtGame(fc.stage)} 뒤`,!!blocked,`<span style="left:0;width:${st.p*100}%;background:var(--grow)"></span>`,blocked?'':`${stageName(sp,st.s+1)}까지 ${tip(fc.stage)}`)}
  // buttons
  $('a-feed').disabled=S.dew<3;
  const cd=Math.max(0,Math.ceil((p.lastWipe+2*GH-Date.now())/60000));$('wipe-cd').textContent=cd>0?`${cd}분 후`:'무료';$('a-wipe').disabled=cd>0;
  $('note').innerHTML=note||(night?`밤에는 광합성을 하지 않아요. 물은 낮보다 천천히 말라요.`:`<b>${sp.name}</b> · ${sp.care.join(' · ')}`);
  // shelf
  $('shelf').innerHTML=S.plants.map(q=>{const t=stageOf(q.xp),n=need(q);return `<button class="slot${q.id===p.id?' on':''}" data-id="${q.id}">${potSVG(q.sp,t.s,t.p,q.id,q.pot,{night})}<span>${pname(q)}</span><span class="tag${n?' need':''}">${n?(n==='과습'?'과습':n+' 필요'):stageName(SPECIES[q.sp],t.s)}</span></button>`}).join('')
    +(S.plants.length<10?`<button class="slot add" data-go="shop"><span>+</span><span>들이기</span></button>`:'');
  $('shelf-count').textContent=`${S.plants.length} / 10`;
  $('dew').textContent=S.dew;
}
function renderShop(){
  $('filters').innerHTML=Object.entries(GROUPS).map(([k,v])=>`<button data-f="${k}" class="${shopFilter===k?'on':''}">${v}</button>`).join('');
  const full=S.plants.length>=10;
  $('shop').innerHTML=SP_KEYS.filter(k=>shopFilter==='all'||SPECIES[k].g===shopFilter).map(k=>{const sp=SPECIES[k],own=S.plants.filter(p=>p.sp===k).length,can=S.dew>=sp.cost&&!full;
    return `<div class="item">${potSVG(k,3,.6,'shop')}<div style="min-width:0"><h4>${sp.name}</h4><div class="meta"><span class="lv">${sp.lv}</span>${sp.care[0]} · 물 ${sp.band[0]}~${sp.band[1]}%${own?` · ${own}개 키우는 중`:''}</div></div>
      <button class="price" data-buy="${k}" ${can?'':'disabled'}>${sp.cost===0?'무료':`이슬 ${sp.cost}`}</button></div>`}).join('');
}
function renderBook(){
  const acc=S.answered?Math.round(S.correct/S.answered*100):0,grown=S.plants.filter(p=>stageOf(p.xp).s===4).length,met=new Set(S.plants.map(p=>p.sp)).size;
  $('stats').innerHTML=`<div class="stat"><b>${S.answered}</b><small>푼 문제</small></div><div class="stat"><b>${acc}%</b><small>정답률</small></div><div class="stat"><b>${S.streak}</b><small>연속 일수</small></div><div class="stat"><b>${met}/${SP_KEYS.length}</b><small>만난 식물</small></div>`;
  document.querySelectorAll('#tabs2 button').forEach(b=>b.classList.toggle('on',b.dataset.t===bookTab));
  const chev=`<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6l4 4 4-4"/></svg>`;
  if(bookTab==='dex'){const owned=new Set(S.plants.map(p=>p.sp));
    $('book').innerHTML=SP_KEYS.map(k=>{const sp=SPECIES[k],o=owned.has(k);return `<details class="entry"><summary>${potSVG(k,o?4:3,1,'book').replace('<svg','<svg class="p'+(o?'':' locked')+'"')}<div style="min-width:0"><h4>${sp.name}</h4><span class="latin" style="font-style:italic;color:var(--muted);font-size:.76rem">${sp.latin}</span></div>${chev}</summary>
      <div class="body"><div class="cares">${sp.care.map(c=>`<span>${c}</span>`).join('')}<span>물 ${sp.band[0]}~${sp.band[1]}%</span></div><ul>${sp.facts.map(f=>`<li>${f}</li>`).join('')}</ul></div></details>`}).join('')}
  else if(bookTab==='wrong'){
    $('book').innerHTML=S.wrong.length?S.wrong.slice().reverse().map(i=>{const q=QUIZ[i];return `<div class="wrongq"><b>${q.q}</b><span class="ans">${q.o[q.a]}</span><p>${q.e}</p></div>`}).join('')+`<button class="ghost" id="retry-wrong" style="margin-top:8px">틀린 문제 다시 풀기 →</button>`:`<p class="empty">틀린 문제가 여기에 모여요. 다시 맞히면 노트에서 빠져요.</p>`}
  else if(bookTab==='save'){
    $('book').innerHTML=`<div class="save-box"><p>진행 상황은 이 기기에 자동으로 저장돼요. 창을 닫았다가 다시 와도 그대로 이어져요.${dbDoc?' 지금은 계정에도 함께 저장되고 있어요.':''}</p>
      <p><b style="color:var(--ink)">다른 기기로 옮기기</b><br>아래 저장 코드를 복사해 두었다가, 새 기기의 같은 칸에 붙여 넣고 불러오면 돼요.</p>
      <textarea id="save-code" readonly aria-label="저장 코드">${exportCode()}</textarea>
      <div class="btns"><button class="chip-btn solid" id="copy-code">코드 복사</button></div>
      <textarea id="load-code" placeholder="여기에 저장 코드를 붙여 넣으세요" aria-label="불러올 저장 코드"></textarea>
      <div class="btns"><button class="chip-btn" id="load-btn">불러오기</button><button class="chip-btn" id="reset-btn">처음부터 시작</button></div></div>`}
  else{$('book').innerHTML=S.log.length?`<div class="log">${S.log.slice().reverse().map(l=>`<div><time>${l.g}</time><span>${l.t}</span></div>`).join('')}</div>`:`<p class="empty">식물이 자라거나 새 식물을 들이면 여기에 기록돼요.</p>`}
}
function renderAll(){renderGarden();renderShop();renderBook()}

/* =============== actions =============== */
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2600)}
function fx(cls,n){const w=$('plant');for(let i=0;i<n;i++){const d=document.createElement('span');d.className=cls;d.style.left=(36+Math.random()*28)+'%';d.style.animationDelay=(Math.random()*.4)+'s';w.appendChild(d);setTimeout(()=>d.remove(),1800)}}
function logIt(t){S.log.push({g:shortStamp(Date.now()),t});if(S.log.length>60)S.log.shift()}
function stageUp(p,s,silent){const sp=SPECIES[p.sp];logIt(`${pname(p)}이(가) ${stageName(sp,s)} 단계가 됐어요`);if(!silent)setTimeout(()=>toast(`${pname(p)}이(가) ${stageName(sp,s)} 단계로 자랐어요`),400)}
function gain(p,x){const b=stageOf(p.xp).s;p.xp+=x;const a=stageOf(p.xp).s;if(a>b)stageUp(p,a)}
const fact=p=>{const f=SPECIES[p.sp].facts;return f[Math.floor(Math.random()*f.length)]};

$('a-water').onclick=()=>{tick();const p=active(),sp=SPECIES[p.sp],b=sp.band;
  if(p.water>b[1]){p.water=Math.min(100,p.water+8);note=`<b>이미 촉촉해요.</b> ${sp.name}은(는) ${b[0]}~${b[1]}%가 좋아요. 흙이 계속 젖어 있으면 뿌리가 숨을 못 쉬어요.`;fx('drop',4)}
  else{p.water=Math.min(100,p.water+25);p.lastWater=Date.now();const ok=p.water<=b[1]+5;if(ok)gain(p,4);
    note=ok?`<b>물을 줬어요.</b> ${fact(p)}`:`<b>조금 많이 줬어요.</b> 받침에 고인 물은 버린다고 생각해 주세요.`;fx('drop',10)}
  save();renderGarden()};
$('a-feed').onclick=()=>{tick();const p=active();if(S.dew<3)return;
  if(p.feed>=75){note='<b>영양분은 충분해요.</b> 비료가 너무 많으면 흙에 염류가 쌓여 뿌리 끝이 타요.';renderGarden();return}
  S.dew-=3;p.feed=Math.min(100,p.feed+30);gain(p,6);fx('spark',10);note='<b>영양제를 줬어요.</b> 잎은 질소, 꽃과 뿌리는 인, 튼튼함은 칼륨이 맡아요.';save();renderGarden()};
$('a-wipe').onclick=()=>{tick();const p=active();p.lastWipe=Date.now();gain(p,2);note='<b>잎을 닦아줬어요.</b> 먼지가 빠지면 빛을 더 잘 받고 기공도 숨쉬기 편해져요.';save();renderGarden()};
$('b-pot').onclick=()=>{const p=active();p.pot=((p.pot??0)+1)%POTS.length;save();renderGarden()};
$('b-rename').onclick=()=>{const p=active(),box=$('name-box');if(box.querySelector('input'))return;
  box.innerHTML=`<input id="rename" maxlength="12" value="${(p.nick||'').replace(/"/g,'&quot;')}" placeholder="${SPECIES[p.sp].name}" aria-label="식물 이름"><div class="latin">비워두면 원래 이름으로 돌아가요 · Enter로 저장</div>`;
  const inp=$('rename');inp.focus();
  const done=()=>{p.nick=inp.value.trim();box.innerHTML=`<h2 id="p-name"></h2><div class="latin" id="p-latin"></div>`;save();renderGarden()};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape'){inp.value=p.nick;inp.blur()}});inp.addEventListener('blur',done,{once:true})};

document.addEventListener('click',e=>{
  const sl=e.target.closest('.slot[data-id]');if(sl){S.active=sl.dataset.id;note='';save();renderGarden();window.scrollTo({top:0,behavior:'smooth'});return}
  const go=e.target.closest('[data-go]');if(go){show(go.dataset.go);return}
  const f=e.target.closest('[data-f]');if(f){shopFilter=f.dataset.f;renderShop();return}
  const buy=e.target.closest('[data-buy]');if(buy&&!buy.disabled){const k=buy.dataset.buy,sp=SPECIES[k];if(S.dew<sp.cost||S.plants.length>=10)return;
    S.dew-=sp.cost;const id='p'+Date.now().toString(36),now=Date.now();
    S.plants.push({id,sp:k,xp:0,water:Math.round((sp.band[0]+sp.band[1])/2),feed:45,lastTick:now,lastWater:now,lastWipe:0,born:now,nick:'',pot:sp.pot});
    S.active=id;note=`<b>${sp.name} 씨앗을 심었어요.</b> ${sp.facts[0]}`;logIt(`${sp.name} 씨앗을 심었어요`);save();renderAll();show('garden');toast(`${sp.name}을(를) 창가에 놓았어요`);return}
  const tb=e.target.closest('[data-t]');
  if(tb&&tb.closest('#tabs2')){bookTab=tb.dataset.t;renderBook();return}
  if(e.target.closest('#copy-code')){const ta=$('save-code');const txt=ta.value;Promise.resolve().then(()=>navigator.clipboard.writeText(txt)).then(()=>toast('저장 코드를 복사했어요')).catch(()=>{ta.focus();ta.select();toast('코드를 길게 눌러 복사해 주세요')});return}
  if(e.target.closest('#load-btn')){const r=importCode($('load-code').value);if(r){S=r;S.lastSeen=Date.now();tick();save(true);renderAll();bookTab='dex';show('garden');toast('정원을 불러왔어요')}else toast('코드를 읽지 못했어요. 처음부터 끝까지 빠짐없이 붙여 넣었는지 확인해 주세요');return}
  const rb=e.target.closest('#reset-btn');if(rb){if(rb.dataset.sure){S=fresh();save(true);renderAll();show('garden');toast('새 정원을 시작했어요')}else{rb.dataset.sure='1';rb.textContent='정말 지울까요? 한 번 더 누르세요'}return}
  if(e.target.closest('#retry-wrong')){openQuiz('wrong');return}
  const nv=e.target.closest('nav button');if(nv)show(nv.dataset.v);
});
function show(v){['garden','shop','book'].forEach(k=>$('v-'+k).hidden=k!==v);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v==='shop')renderShop();if(v==='book')renderBook();if(v==='garden')renderGarden();window.scrollTo({top:0})}
$('again').onclick=()=>openQuiz('more');
function awayReward(){
  const now=Date.now(),last=S.lastSeen||0;S.lastSeen=now;
  if(!last)return null;
  const min=(now-last)/60000;if(min<5)return null;
  const dew=Math.min(150,Math.max(2,Math.round(min/3)));   // 3분마다 이슬 1, 최대 150
  S.dew+=dew;logIt(`${fmtAway(min)} 공부하고 돌아왔어요 · 이슬 ${dew}`);save();
  return{min,dew};
}
function fmtAway(min){if(min<60)return Math.round(min)+'분';const h=Math.floor(min/60),m=Math.round(min%60);return m?`${h}시간 ${m}분`:`${h}시간`}
const seen=()=>{S.lastSeen=Date.now();save()};

/* =============== quiz (한 번에 한 문제) =============== */
let Q=null;
function pickQ(mode){
  if(mode==='wrong'&&S.wrong.length)return S.wrong[Math.floor(Math.random()*S.wrong.length)];
  let pool=QUIZ.map((_,i)=>i).filter(i=>!S.seen.includes(i));if(!pool.length){S.seen=[];pool=QUIZ.map((_,i)=>i)}
  return pool[Math.floor(Math.random()*pool.length)];
}
function hello(){const h=new Date().getHours();return h<5?'늦은 밤까지 고생 많아요':h<11?'좋은 아침이에요':h<14?'점심은 챙겨 먹었어요?':h<18?'공부하다 잠깐 쉬러 왔군요':'오늘 하루도 수고했어요'}
function openQuiz(mode){Q={id:pickQ(mode),mode,picked:null};$('sheet').hidden=false;document.body.style.overflow='hidden';renderQ()}
function closeQuiz(){$('sheet').hidden=true;document.body.style.overflow='';Q=null;renderGarden()}
function renderQ(){
  const q=QUIZ[Q.id],ans=Q.picked!==null,p=active(),st=stageOf(p.xp),ok=ans&&Q.picked===q.a;
  const away=Q.mode==='open'&&pendingAway?`<div class="welcome"><svg viewBox="0 0 16 16"><path d="M8 1.5C8 1.5 3 7 3 10a5 5 0 0 0 10 0c0-3-5-8.5-5-8.5z" fill="var(--water)"/></svg><div><b>${fmtAway(pendingAway.min)} 동안 공부하고 왔네요</b><span>그동안 맺힌 이슬 ${pendingAway.dew}개를 받았어요</span></div></div>`:'';
  const head=away+(Q.mode==='open'?`<div class="q-head">${potSVG(p.sp,st.s,st.p,p.id,p.pot,{sway:true})}<div><h2>${hello()}</h2><p>${pname(p)}에게 가기 전에 한 문제만 풀어요. 맞히면 이슬 5, 틀려도 1.</p></div></div>`:'');
  $('q-in').innerHTML=`${head}<div><div class="q-label">${Q.mode==='wrong'?'오답 다시 풀기':'오늘의 식물 문제'}</div><p class="q-text">${q.q}</p></div>
   <div class="opts">${q.o.map((t,k)=>`<button class="opt ${ans?(k===q.a?'right':k===Q.picked?'wrong':'dim'):''}" data-k="${k}" ${ans?'disabled':''}><span class="k">${'ABCD'[k]}</span><span>${t}</span></button>`).join('')}</div>
   ${ans?`<div class="explain"><b>${ok?'정답이에요':'정답은 '+'ABCD'[q.a]+'. '+q.o[q.a]}</b>${q.e}<div class="gain" style="margin-top:6px">이슬 +${ok?5:1}${ok?'':' · 오답 노트에 담았어요'}</div></div>`:''}
   <div class="q-foot">${ans?`<button class="link" id="q-more">한 문제 더</button><button class="cta" id="q-go">정원으로</button>`:`<button class="link" id="q-skip">${Q.mode==='open'?'오늘은 건너뛰기':'닫기'}</button><span></span>`}</div>`;
  $('q-in').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  if(ans){$('q-go').onclick=closeQuiz;$('q-go').focus();$('q-more').onclick=()=>{Q={id:pickQ(Q.mode==='wrong'?'wrong':'more'),mode:Q.mode==='wrong'&&S.wrong.length?'wrong':'more',picked:null};renderQ();$('sheet').scrollTop=0}}
  else $('q-skip').onclick=closeQuiz;
}
function answer(k){
  if(Q.picked!==null)return;const q=QUIZ[Q.id];Q.picked=k;const ok=k===q.a;
  S.answered++;if(ok)S.correct++;S.dew+=ok?5:1;
  if(!S.seen.includes(Q.id))S.seen.push(Q.id);
  if(ok)S.wrong=S.wrong.filter(i=>i!==Q.id);else if(!S.wrong.includes(Q.id))S.wrong.push(Q.id);
  const t=dayKey(new Date());if(S.lastQuizDay!==t){const yk=dayKey(new Date(Date.now()-864e5));S.streak=S.lastQuizDay===yk?S.streak+1:1;S.lastQuizDay=t}
  save();renderQ();$('dew').textContent=S.dew;
}

/* =============== boot =============== */
try{if('serviceWorker' in navigator&&document.querySelector('link[rel=manifest]'))navigator.serviceWorker.register('/sw.js').catch(()=>{})}catch(e){}
tick();pendingAway=awayReward();renderAll();openQuiz('open');save();
setInterval(()=>{if(document.hidden)return;renderScene()},5000);
setInterval(()=>{if(document.hidden)return;tick();seen();if(!$('v-garden').hidden&&$('sheet').hidden)renderGarden()},30000);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){seen();save(true);return}
  tick();const r=awayReward();renderGarden();if(r)toast(`${fmtAway(r.min)} 동안 공부하고 왔네요 · 이슬 +${r.dew}`);
});
window.addEventListener('pagehide',()=>{S.lastSeen=Date.now();save(true)});
})();
</script>

</body>
</html>
